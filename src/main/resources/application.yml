spring:
  ai:
    mcp:
      client:
        enabled: true
        name: embabel-product-agent
        version: 1.0.0
        request-timeout: 5s
        type: SYNC
        streamable-http:
          connections:
            platform-rules:
              url: http://localhost:8081
              endpoint: /mcp

embabel:
  models:
    default-llm: deepseek-v4-flash
    default-embedding-model: bge-m3
  agent:
    platform:
      models:
        openai:
          custom:
            api-key: ${DEEPSEEK_API_KEY}
            base-url: https://api.deepseek.com
            models: deepseek-v4-flash
      tools:
        includes:
          platform-rules:
            description: 查询远程平台的商品视频发布规则
            provider: platform-rules-mcp
            tools:
              - query_platform_rule

spring:
  ai:
    model:
      embedding: ollama
    ollama:
      base-url: http://localhost:11434
      embedding:
        model: bge-m3

demo:
  quiz-agent:
    prompts:
      extract-concepts: |
        请从技术文章中抽取 3 到 5 个适合出测验题的核心知识点。
        每个知识点包含 name 和 explanation。
        不要抽取太泛的词，比如“AI”“Java”。
        只返回结构化对象，不要解释。

        标题：{title}
        正文：
        {content}
      generate-quiz: |
        请根据技术文章和核心知识点生成 3 道单选题。
        题干、选项、答案和解释都用中文输出。
        每道题必须包含 question、options、answer、explanation。
        options 必须正好 4 个选项。
        answer 必须和 options 中的一个选项完全一致。
        explanation 必须说明为什么选这个答案。
        题目要考理解，不要考死记硬背。
        只返回结构化对象，不要解释。

        标题：{title}
        核心知识点：{concepts}
        正文：
        {content}
      review-quiz: |
        请检查下面的测验题是否适合技术文章复盘。
        如果题目过泛、答案不在选项里、解释不完整，请修正后返回。
        最终返回 QuizPack：title、questions、review。
        title、questions、review 都用中文输出。
        questions 保留 3 道题，每题 4 个选项。
        review 用一句完整中文说明这套题主要考察什么，以中文句号结尾。

        文章标题：{title}
        候选题：
        {questions}
  code-review-agent:
    prompts:
      review-code: |
        请审查用户提供的 Java 代码。
        重点检查空指针、集合越界、资源泄漏、并发问题、错误处理和可维护性。
        返回结构化的 CodeReviewReport：
        summary 用一句完整中文概括审查结论，以中文句号结尾；
        findings 列出已经从代码中确认的问题；
        每个 finding 包含 severity、problem 和 suggestion；
        severity 只能使用 HIGH、MEDIUM 或 LOW。
        如果没有确认的问题，findings 可以为空，不要为了凑数量编造问题。

        用户提交的代码和要求：
        {request}
  parallel-incident-agent:
    prompts:
      analyze-logs: |
        请只根据故障现象和日志片段整理日志证据。
        返回AnalysisContent：items、conclusion、flagged。
        items列出1到5条日志中已经出现的异常或关键信息。
        conclusion用一句完整中文说明日志能支持什么判断，以中文句号结尾。
        flagged表示日志里是否出现明确异常。
        不要补充输入中没有的日志，也不要把推测写成事实。
        只返回结构化对象。

        故障现象：{symptom}
        日志片段：{logs}
      analyze-metrics: |
        请只根据故障现象和监控指标整理指标证据。
        返回AnalysisContent：items、conclusion、flagged。
        items列出1到5条已经出现的指标变化。
        conclusion用一句完整中文说明指标能支持什么判断，以中文句号结尾。
        flagged表示指标里是否出现明确异常。
        不要编造新的指标或阈值，也不要直接判断根因。
        只返回结构化对象。

        故障现象：{symptom}
        监控指标：{metrics}
      analyze-recent-change: |
        请只根据故障现象和最近变更整理需要核对的关联点。
        返回AnalysisContent：items、conclusion、flagged。
        items列出1到5条变更与故障之间值得核对的关系。
        conclusion用一句完整中文说明这次变更是否值得优先排查，以中文句号结尾。
        flagged表示是否存在值得优先核对的变更。
        不能因为时间接近就把变更直接认定为根因。
        只返回结构化对象。

        故障现象：{symptom}
        最近变更：{recentChange}
      consolidate-report: |
        请根据三类分析结果生成IncidentConclusion：
        summary、probableCause、immediateActions、verificationSteps。
        summary用一句完整中文概括当前判断，以中文句号结尾。
        probableCause说明最可能的原因和判断依据，以中文句号结尾；
        证据不足时要明确写“仍需验证”，不能写成已经确认。
        immediateActions列出2到5个马上可以执行的处理动作，按顺序排列。
        verificationSteps列出2到5个用于确认原因或验证恢复结果的检查项。
        只能使用输入中的证据，不要虚构系统、命令、人员或指标阈值。
        必须满足质量要求，并根据上一轮反馈修正问题。
        只返回结构化对象。

        故障现象：{symptom}
        质量要求：{qualityRequirement}
        上一轮反馈：{feedback}
        三类分析结果：
        {evidence}
      evaluate-report: |
        请评估故障报告是否可以交给值班人员继续处理。
        返回ReportEvaluation：score、issues。
        score范围是0.0到1.0。
        issues列出报告中仍需修正的问题；没有问题时填写“没有需要修正的问题”。

        评分时检查：
        1.结论是否只使用已有证据；
        2.可能原因是否说明依据，证据不足时是否明确写“仍需验证”；
        3.立即处理动作是否具体、可执行并有先后顺序；
        4.验证步骤能否确认原因和恢复结果；
        5.是否满足用户给出的质量要求。

        只有全部满足时，score才能达到0.9或以上。
        不要补写报告，只指出问题。
        只返回结构化对象。

        故障现象：{symptom}
        质量要求：{qualityRequirement}
        三类分析结果：
        {evidence}
        待评估报告：
        {report}
  commercial-video-agent:
    prompts:
      prepare-brief: |
        请根据输入整理ProductBrief：
        productName、audience、platform、durationSeconds、
        sellingPoints、factualBoundaries。
        sellingPoints列出3到5条可以用于视频表达的商品卖点。
        factualBoundaries列出2到5条不能超出商品资料的事实边界。
        只能使用商品资料中已经给出的信息，不要补充功效、认证、销量或价格。
        只返回结构化对象。

        商品名称：{productName}
        商品资料：{productFacts}
        目标人群：{audience}
        发布平台：{platform}
        视频时长：{durationSeconds}秒
      write-script: |
        请根据商品简报生成VideoScript：
        hook、voiceover、closing、onScreenTexts。
        hook用于视频开头吸引目标人群，但不能制造焦虑或夸大商品作用。
        voiceover是一段完整中文口播，适合目标时长。
        closing给出自然收尾，不写虚假的限时、库存或销量信息。
        onScreenTexts列出3到6条适合画面展示的短字幕。
        只能使用商品简报里的事实和卖点。
        只返回结构化对象。

        商品简报：
        {brief}
      create-storyboard: |
        请把商品简报和视频脚本拆成Storyboard。
        shots按播放顺序排列，每个Shot包含：
        sequence、durationSeconds、visual、voiceover、
        caption、requiredMaterial。
        每个镜头至少1秒，全部镜头时长相加必须等于目标时长。
        visual描述要拍什么，requiredMaterial说明需要哪类商品素材。
        不能增加商品简报中没有的商品事实。
        只返回结构化对象。

        目标时长：{durationSeconds}秒
        商品简报：
        {brief}
        视频脚本：
        {script}
      review-plan: |
        请检查商业视频方案，返回PlanReview：ready、issues。
        检查商品事实是否超出简报、脚本和分镜是否一致、
        镜头总时长是否符合目标时长、每个镜头是否写清素材要求。
        全部满足时ready为true，issues填写“没有需要修正的问题”。
        存在问题时ready为false，issues列出具体问题。
        只检查，不要重写脚本或分镜。
        只返回结构化对象。

        目标时长：{expectedDuration}秒
        分镜总时长：{actualDuration}秒
        商品简报：
        {brief}
        视频脚本：
        {script}
        分镜：
        {storyboard}
  product-tool-agent:
    prompts:
      answer-business-question: |
        请回答用户的商品业务问题，
        返回BusinessAnswer：
        answer、evidence。

        先理解用户的问题，再根据每个工具的名称、说明和参数，
        选择能补全答案所需的工具。
        不要为了凑数量调用工具，也不要调用与问题无关的工具。
        需要综合判断时，查询所有能支撑这个判断的必要事实。

        如果缺少查询所需的商品ID、店铺ID或平台名称，
        直接说明还需要什么信息，不要猜测，也不要调用无关工具。
        answer只能根据工具返回的事实作答。
        evidence列出支持答案的关键事实；没有查询结果时返回空列表。
        只返回结构化对象。

        用户问题：
        {question}
  product-knowledge-agent:
    prompts:
      answer-with-evidence: |
        请只根据检索到的资料回答商品内容问题。
        返回KnowledgeDraft，其中answer使用中文完整回答。

        先说明哪些卖点可以使用，再说明哪些表达不能使用，
        最后给出适合目标平台的制作建议。
        资料中没有出现的信息不要补充，也不要把推测写成事实。
        只返回结构化对象。

        商品ID：{productId}
        发布平台：{platform}
        问题：{question}

        检索到的资料：
        {evidence}
  remote-platform-agent:
    prompts:
      check-publish-readiness: |
        请判断商品视频是否具备发布条件，
        返回RemotePublishDecision：
        publishable、conclusion、evidence、blockers、
        platformRuleSource、platformRuleVersion。

        你可以使用本地商品、库存价格、店铺查询工具，
        以及远程平台规则查询工具query_platform_rule。
        必须调用这四个工具后再判断，不能根据常识补充数据。

        判断规则：
        商品必须处于ON_SALE状态；
        可售库存必须大于0；
        店铺必须启用，并且允许发布到目标平台；
        视频时长不能超过远程平台规则给出的上限；
        商品价格和平台必填信息必须能从工具结果中找到。

        platformRuleSource和platformRuleVersion
        必须原样填写远程平台规则工具返回的值。
        evidence列出4到7条工具返回的事实。
        没有阻塞项时，blockers填写“没有阻塞项”。
        只返回结构化对象。

        商品ID：{productId}
        店铺ID：{storeId}
        发布平台：{platform}
        视频时长：{durationSeconds}秒
