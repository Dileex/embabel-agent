embabel:
  models:
    default-llm: deepseek-v4-flash
  agent:
    platform:
      models:
        openai:
          custom:
            api-key: ${DEEPSEEK_API_KEY}
            base-url: https://api.deepseek.com
            models: deepseek-v4-flash

demo:
  quiz-agent:
    prompts:
      extract-concepts: |
        请从技术文章中抽取 3 到 5 个适合出测验题的核心知识点。
        每个知识点包含 name 和 explanation。
        不要抽取太泛的词，比如“AI”“Java”。
        只返回结构化对象，不要解释。

        标题：{title}
        正文：
        {content}
      generate-quiz: |
        请根据技术文章和核心知识点生成 3 道单选题。
        题干、选项、答案和解释都用中文输出。
        每道题必须包含 question、options、answer、explanation。
        options 必须正好 4 个选项。
        answer 必须和 options 中的一个选项完全一致。
        explanation 必须说明为什么选这个答案。
        题目要考理解，不要考死记硬背。
        只返回结构化对象，不要解释。

        标题：{title}
        核心知识点：{concepts}
        正文：
        {content}
      review-quiz: |
        请检查下面的测验题是否适合技术文章复盘。
        如果题目过泛、答案不在选项里、解释不完整，请修正后返回。
        最终返回 QuizPack：title、questions、review。
        title、questions、review 都用中文输出。
        questions 保留 3 道题，每题 4 个选项。
        review 用一句完整中文说明这套题主要考察什么，以中文句号结尾。

        文章标题：{title}
        候选题：
        {questions}
  code-review-agent:
    prompts:
      review-code: |
        请审查用户提供的 Java 代码。
        重点检查空指针、集合越界、资源泄漏、并发问题、错误处理和可维护性。
        返回结构化的 CodeReviewReport：
        summary 用一句完整中文概括审查结论，以中文句号结尾；
        findings 列出已经从代码中确认的问题；
        每个 finding 包含 severity、problem 和 suggestion；
        severity 只能使用 HIGH、MEDIUM 或 LOW。
        如果没有确认的问题，findings 可以为空，不要为了凑数量编造问题。

        用户提交的代码和要求：
        {request}
  parallel-incident-agent:
    prompts:
      analyze-logs: |
        请只根据故障现象和日志片段整理日志证据。
        返回AnalysisContent：items、conclusion、flagged。
        items列出1到5条日志中已经出现的异常或关键信息。
        conclusion用一句完整中文说明日志能支持什么判断，以中文句号结尾。
        flagged表示日志里是否出现明确异常。
        不要补充输入中没有的日志，也不要把推测写成事实。
        只返回结构化对象。

        故障现象：{symptom}
        日志片段：{logs}
      analyze-metrics: |
        请只根据故障现象和监控指标整理指标证据。
        返回AnalysisContent：items、conclusion、flagged。
        items列出1到5条已经出现的指标变化。
        conclusion用一句完整中文说明指标能支持什么判断，以中文句号结尾。
        flagged表示指标里是否出现明确异常。
        不要编造新的指标或阈值，也不要直接判断根因。
        只返回结构化对象。

        故障现象：{symptom}
        监控指标：{metrics}
      analyze-recent-change: |
        请只根据故障现象和最近变更整理需要核对的关联点。
        返回AnalysisContent：items、conclusion、flagged。
        items列出1到5条变更与故障之间值得核对的关系。
        conclusion用一句完整中文说明这次变更是否值得优先排查，以中文句号结尾。
        flagged表示是否存在值得优先核对的变更。
        不能因为时间接近就把变更直接认定为根因。
        只返回结构化对象。

        故障现象：{symptom}
        最近变更：{recentChange}
      consolidate-report: |
        请根据三类分析结果生成IncidentConclusion：
        summary、probableCause、immediateActions、verificationSteps。
        summary用一句完整中文概括当前判断，以中文句号结尾。
        probableCause说明最可能的原因和判断依据，以中文句号结尾；
        证据不足时要明确写“仍需验证”，不能写成已经确认。
        immediateActions列出2到5个马上可以执行的处理动作，按顺序排列。
        verificationSteps列出2到5个用于确认原因或验证恢复结果的检查项。
        只能使用输入中的证据，不要虚构系统、命令、人员或指标阈值。
        只返回结构化对象。

        故障现象：{symptom}
        三类分析结果：
        {evidence}
